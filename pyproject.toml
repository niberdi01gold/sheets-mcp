[project]
name = "sheets-mcp"
version = "0.1.0"
description = "MCP server that connects Claude and other MCP clients to Google Sheets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas Berrios" }]
keywords = ["mcp", "model-context-protocol", "google-sheets", "claude", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "google-api-python-client>=2.100",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/niberdi01gold/sheets-mcp"
Issues = "https://github.com/niberdi01gold/sheets-mcp/issues"

[project.scripts]
sheets-mcp = "sheets_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheets_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
